<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistem Terintegrasi CV TWA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: app shell. Sidebar modul di kiri, konten di kanan. HP: drawer + topbar. */
  --bg:#eef0ee; --surface:#ffffff; --ink:#1b2425; --muted:#5d6a6b; --line:#d9dfdc;
  --accent:#a9600f; --accent-ink:#ffffff; --accent-soft:#f5e8d6;
  --side:#1d2829; --side-ink:#d5ddda; --side-mute:#8c9a98;
  --ok:#2b7a4b; --ok-soft:#e2f1e8; --warn:#9a6512; --warn-soft:#f8ecd2; --bad:#ad3434; --bad-soft:#f6e0de; --info:#2a6589; --info-soft:#e0edf4;
  --font-display:"Barlow Semi Condensed","Arial Narrow",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121819; --surface:#1a2223; --ink:#e5eae8; --muted:#9aa7a5; --line:#2c3738;
  --accent:#e1953f; --accent-ink:#1b1206; --accent-soft:#3a2a16;
  --side:#0d1213; --side-ink:#cfd8d5; --side-mute:#7d8b89;
  --ok:#62b884; --ok-soft:#173326; --warn:#e2ad4e; --warn-soft:#3a2d12; --bad:#e57a72; --bad-soft:#3d1c1a; --info:#6eaad0; --info-soft:#14293a;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#121819; --surface:#1a2223; --ink:#e5eae8; --muted:#9aa7a5; --line:#2c3738;
  --accent:#e1953f; --accent-ink:#1b1206; --accent-soft:#3a2a16;
  --side:#0d1213; --side-ink:#cfd8d5; --side-mute:#7d8b89;
  --ok:#62b884; --ok-soft:#173326; --warn:#e2ad4e; --warn-soft:#3a2d12; --bad:#e57a72; --bad-soft:#3d1c1a; --info:#6eaad0; --info-soft:#14293a;
  color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body)}
h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:26px} h2{font-size:20px} h3{font-size:17px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,td.n,.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:24px 16px}
.login-card{width:100%;max-width:880px;display:grid;grid-template-columns:1.1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.login-side{background:var(--side);color:var(--side-ink);padding:32px;display:flex;flex-direction:column;gap:16px}
.login-side h1{font-size:32px;color:#fff}
.plyband{height:14px;border-radius:3px;background:repeating-linear-gradient(180deg,#c98a3c 0 3px,#8a5a22 3px 4px,#e2b678 4px 7px,#8a5a22 7px 8px)}
.login-form{padding:32px;display:flex;flex-direction:column;gap:14px}
.demo-users{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
@media (max-width:720px){.login-card{grid-template-columns:1fr}.login-side,.login-form{padding:22px}}

/* Shell */
.app{display:grid;grid-template-columns:236px 1fr;height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;overflow-y:auto}
.brand{padding:18px 18px 12px;display:flex;flex-direction:column;gap:8px}
.brand b{font-family:var(--font-display);font-size:21px;color:#fff;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--side-mute)}
.nav{display:flex;flex-direction:column;padding:6px 10px 16px;gap:2px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--side-mute);padding:12px 8px 4px}
.nav a{color:var(--side-ink);text-decoration:none;padding:7px 10px;border-radius:6px;display:flex;justify-content:space-between;align-items:center;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--accent);color:var(--accent-ink);font-weight:500}
.nav a .cnt{font-family:var(--font-mono);font-size:11px;background:rgba(255,255,255,.14);padding:0 6px;border-radius:9px}
.nav a.on .cnt{background:rgba(0,0,0,.18)}
.main{display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
.top{display:flex;align-items:center;gap:12px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .ttl{flex:1;min-width:0}
.top .ttl h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:6px;width:38px;height:38px;cursor:pointer}
.net{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--surface);cursor:pointer;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.net.off .dot{background:var(--warn)}
.who{display:flex;align-items:center;gap:8px;font-size:13px}
.who .role{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 7px;font-weight:600}
.content{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.scrim{display:none}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:260px;z-index:40;transform:translateX(-100%);transition:transform .2s}
  .side.open{transform:none}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:30}
  .burger{display:grid;place-items:center}
  .who .nm{display:none}
  .top{padding:8px 12px;gap:8px}
  .content{padding:14px 12px}
}
@media (max-width:520px){.net .lbl{display:none}}

/* Blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--font-mono);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--muted)}
@media (max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--bg);padding:8px 10px;white-space:nowrap}
td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
td .btn{padding:4px 9px;font-size:13px}
.pill{display:inline-block;border-radius:4px;padding:1px 8px;font-size:12px;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)} .p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--bg);color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.empty{padding:14px;color:var(--muted);font-size:14px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 6px 6px 0;font-size:14px}
.deny{padding:40px 16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}

/* Pipeline & stepper */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pipe div{background:var(--bg);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:2px;border-top:3px solid var(--line)}
.pipe div.has{border-top-color:var(--accent)}
.pipe b{font-family:var(--font-mono);font-size:22px;font-weight:500}
.pipe span{font-size:12px;color:var(--muted)}
@media (max-width:640px){.pipe{grid-template-columns:repeat(3,minmax(0,1fr))}}
.steps{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
.step{border-radius:5px;padding:7px 8px;background:var(--bg);font-size:12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.step .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step.done{background:var(--ok-soft)} .step.done .nm{color:var(--ok)}
.step.cur{background:var(--accent-soft);outline:1px solid var(--accent)} .step.cur .nm{color:var(--accent)}
@media (max-width:640px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.wo{border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.wo-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.task{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task a{color:var(--accent);font-weight:500;text-decoration:none;white-space:nowrap}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow .f{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px;display:flex;flex-direction:column;gap:2px;flex:1 1 150px}
.flow .f b{font-size:14px}
.flow .f.main{background:var(--accent-soft);border-color:var(--accent)}
.prose{max-width:72ch;display:flex;flex-direction:column;gap:8px}
.prose ul,.prose ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.yes{color:var(--ok);font-weight:600} .no{color:var(--line)}

/* Modal & toast */
.modal{position:fixed;inset:0;background:rgba(10,14,14,.5);display:grid;place-items:center;z-index:60;padding:16px}
.modal[hidden]{display:none}
.sheet{background:var(--surface);border-radius:10px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border:1px solid var(--line)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sheet .x{border:0;background:none;font-size:22px;cursor:pointer;line-height:1;width:32px;height:32px}
.sheet form>div{padding:16px;display:flex;flex-direction:column;gap:12px}
.sheet footer{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:13px;font-weight:500}
.fld input,.fld select{border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--surface);width:100%}
.fld .hint{font-size:12px;color:var(--muted)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--bad);font-size:13px;min-height:0}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--side);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:80;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>

<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h3 id="mTitle">Form</h3><button type="button" class="x" data-close aria-label="Tutup">×</button></header>
    <form id="mForm" novalidate>
      <div id="mBody"></div>
      <footer><button type="button" class="btn ghost" data-close>Batal</button><button type="submit" class="btn primary" id="mOk">Simpan</button></footer>
    </form>
  </div>
</div>
<div id="toast" class="toast" hidden role="status"></div>

<script>
/* ============ KONSTANTA ============ */
const ROLES={owner:'Owner',manajer:'Manajer',admin:'Admin',telly:'Telly',produksi:'Produksi',gudang:'Gudang',pengiriman:'Pengiriman',keuangan:'Keuangan',akuntansi:'Akuntansi'};
const USERS0=[
  {u:'owner',name:'Bpk. Hartono',role:'owner'},
  {u:'manajer',name:'Dwi Saputra',role:'manajer'},
  {u:'admin',name:'Rina Lestari',role:'admin'},
  {u:'telly',name:'Sutrisno',role:'telly'},
  {u:'produksi',name:'Agus Prasetyo',role:'produksi'},
  {u:'gudang',name:'Bambang W.',role:'gudang'},
  {u:'pengiriman',name:'Joko Susilo',role:'pengiriman'},
  {u:'keuangan',name:'Sri Wahyuni',role:'keuangan'},
  {u:'akuntansi',name:'Maya Anggraini',role:'akuntansi'}
];
const ALL=Object.keys(ROLES);
const MODULES=[
  {id:'dashboard',label:'Dashboard',grp:'Ringkas',view:ALL},
  {id:'rancangan',label:'Rancangan Sistem',grp:'Ringkas',view:ALL},
  {id:'pesanan',label:'Pesanan (PO)',grp:'Penjualan',view:['owner','manajer','admin','produksi','gudang','pengiriman','keuangan']},
  {id:'penerimaan',label:'Penerimaan OPC',grp:'Bahan Baku',view:['owner','manajer','admin','telly','gudang','keuangan','akuntansi']},
  {id:'stok',label:'Stok Bahan Baku',grp:'Bahan Baku',view:['owner','manajer','admin','gudang','produksi','akuntansi']},
  {id:'produksi',label:'Produksi',grp:'Produksi',view:['owner','manajer','admin','produksi','gudang']},
  {id:'gudang',label:'Gudang & Packing',grp:'Produksi',view:['owner','manajer','admin','gudang','pengiriman']},
  {id:'pengiriman',label:'Pengiriman',grp:'Distribusi',view:['owner','manajer','admin','telly','gudang','pengiriman','keuangan']},
  {id:'keuangan',label:'Keuangan',grp:'Keuangan',view:['owner','manajer','keuangan','akuntansi']},
  {id:'akuntansi',label:'Akuntansi',grp:'Keuangan',view:['owner','manajer','keuangan','akuntansi']},
  {id:'pengguna',label:'Pengguna & Akses',grp:'Sistem',view:['owner','manajer']}
];
const PERM={
  addSO:{label:'Input pesanan (PO)',roles:['admin','manajer']},
  approveSO:{label:'Setujui pesanan',roles:['manajer','owner']},
  addRcv:{label:'Tally penerimaan OPC',roles:['telly','gudang']},
  verifyRcv:{label:'Verifikasi penerimaan',roles:['gudang','manajer']},
  createWO:{label:'Terbitkan SPK produksi',roles:['produksi','manajer']},
  stage:{label:'Catat hasil tahap produksi',roles:['produksi']},
  pack:{label:'Packing barang jadi',roles:['gudang']},
  createSJ:{label:'Buat surat jalan',roles:['pengiriman','admin']},
  load:{label:'Tally muat & kirim',roles:['telly','pengiriman']},
  invoice:{label:'Terbitkan invoice',roles:['keuangan']},
  payIn:{label:'Terima pembayaran',roles:['keuangan']},
  payOut:{label:'Bayar hutang supplier',roles:['keuangan']},
  expense:{label:'Catat biaya operasional',roles:['keuangan']},
  journal:{label:'Jurnal penyesuaian',roles:['akuntansi']},
  role:{label:'Atur peran pengguna',roles:['owner']}
};
const STAGES=['Glue Spreader','Lay-up','Cold Press','Hot Press','Finishing','Grading'];
const STAGE_NOTE=['Lem UF + tepung dioles ke core','Susun face–core–back, serat silang','Pre-press dingin ±30–60 menit','Press panas ±110–120 °C','Trim, dempul, amplas','Sortir mutu & afkir'];
const SO_ST=['Baru','Disetujui','Produksi','Siap Kirim','Dikirim','Selesai'];
const ACC={kas:'1100 Kas & Bank',piut:'1200 Piutang Usaha',pbb:'1300 Persediaan Bahan Baku',bdp:'1310 Barang Dalam Proses',pbj:'1320 Persediaan Barang Jadi',hut:'2100 Hutang Usaha',modal:'3100 Modal Pemilik',jual:'4100 Penjualan',hpp:'5100 Harga Pokok Penjualan',beban:'6100 Beban Operasional'};
const KEY='cvtwa-proto-v1';
const PIN='1234';

/* ============ UTIL ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=(n,d=0)=>Number(n||0).toLocaleString('id-ID',{minimumFractionDigits:d,maximumFractionDigits:d});
const rp=n=>'Rp '+num(Math.round(n));
const rpj=n=>'Rp '+num(n/1e6,1)+' jt';
const TODAY=(()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)})();
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const fd=iso=>iso?new Date(iso+'T12:00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}):'–';
const daysTo=iso=>Math.round((new Date(iso+'T12:00:00')-new Date(TODAY+'T12:00:00'))/864e5);
const sum=(a,f)=>a.reduce((s,x)=>s+f(x),0);

/* ============ STATE ============ */
let S=null, ME=null, simOffline=false;
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const prod=id=>S.products.find(p=>p.id===id);
const mat=id=>S.materials.find(m=>m.id===id);
const bySO=no=>S.so.find(x=>x.no===no);
const byNo=(arr,no)=>S[arr].find(x=>x.no===no);
const uname=u=>(S.users.find(x=>x.u===u)||{name:u}).name;
const can=a=>ME&&PERM[a].roles.includes(ME.role);
const canView=id=>ME&&MODULES.find(m=>m.id===id).view.includes(ME.role);
function nextNo(p,date){S.seq[p]=(S.seq[p]||0)+1;return `${p}-${date.slice(2,4)}${date.slice(5,7)}-${String(S.seq[p]).padStart(3,'0')}`}
function jr(date,desc,ref,lines){S.seq.jr++;S.journal.push({id:S.seq.jr,date,desc,ref,lines:lines.map(l=>[l[0],Math.round(l[1]),Math.round(l[2])])})}
function bal(acc){let d=0,c=0;S.journal.forEach(j=>j.lines.forEach(l=>{if(l[0]===acc){d+=l[1];c+=l[2]}}));return d-c}
const m3=(m,q)=>q*1.27*2.54*(m.thick||0)/1000;
const unitCost=pid=>{const p=prod(pid);return p.opc*mat(p.opcType).cost+2*mat('FB').cost+p.lem*mat('LEM').cost};
const reserved=pid=>sum(S.so.filter(s=>s.p===pid&&s.packed&&s.status==='Siap Kirim'),s=>s.qty);
const avail=pid=>S.fg[pid].qty-reserved(pid);

/* ============ AKSI BISNIS (setiap aksi = 1 transaksi + jurnal otomatis) ============ */
const A={
  addSO(o,by){const so={no:nextNo('SO',o.date),date:o.date,cust:o.cust,p:o.p,qty:+o.qty,price:+o.price,due:o.due,status:'Baru',by,packed:null};S.so.push(so);return so},
  approveSO(no,by,date){const so=bySO(no);so.status='Disetujui';so.appBy=by;so.appDate=date},
  addRcv(o,by){const r={no:nextNo('RCV',o.date),date:o.date,supplier:o.supplier,mat:o.mat,qty:+o.qty,reject:+o.reject,ka:o.ka,price:+o.price,telly:by,status:'Menunggu verifikasi'};S.rcv.push(r);return r},
  verifyRcv(no,by,date){const r=byNo('rcv',no),m=mat(r.mat),good=r.qty-r.reject,val=good*r.price;
    m.cost=(m.stock*m.cost+val)/(m.stock+good);m.stock+=good;r.status='Diverifikasi';r.verBy=by;
    S.payables[r.supplier]=(S.payables[r.supplier]||0)+val;
    jr(date,`Terima ${m.name} – ${r.supplier}`,r.no,[[ACC.pbb,val,0],[ACC.hut,0,val]])},
  need(pid,qty){const p=prod(pid);return [[p.opcType,p.opc*qty],['FB',2*qty],['LEM',p.lem*qty]]},
  createWO(no,by,date){const so=bySO(no),need=A.need(so.p,so.qty);
    for(const [id,q] of need){if(mat(id).stock<q)return `Stok ${mat(id).name} kurang: perlu ${num(q)}, ada ${num(mat(id).stock)}.`}
    let cost=0;need.forEach(([id,q])=>{const m=mat(id);cost+=q*m.cost;m.stock-=q});
    const wo={no:nextNo('WO',date),date,so:so.no,p:so.p,qty:so.qty,stage:0,log:[],cost:Math.round(cost),status:'Berjalan',by};
    S.wo.push(wo);so.status='Produksi';so.wo=wo.no;
    jr(date,`Pemakaian bahan baku ${wo.no}`,wo.no,[[ACC.bdp,cost,0],[ACC.pbb,0,cost]]);return wo},
  stageIn(wo){return wo.log.length?wo.log[wo.log.length-1].ok:wo.qty},
  stage(no,ok,by,date){const wo=byNo('wo',no),inp=A.stageIn(wo);ok=+ok;
    if(!(ok>=0)||ok>inp)return `Lembar OK harus 0 s.d. ${num(inp)}.`;
    wo.log.push({stage:STAGES[wo.stage],inp,ok,rej:inp-ok,by,date});wo.stage++;
    if(wo.stage===STAGES.length){wo.status='Selesai';wo.done=date;const f=S.fg[wo.p];
      if(f.qty+ok>0)f.cost=(f.qty*f.cost+wo.cost)/(f.qty+ok);f.qty+=ok;
      const so=bySO(wo.so);so.status='Siap Kirim';
      jr(date,`Barang jadi ${wo.no} masuk gudang`,wo.no,[[ACC.pbj,wo.cost,0],[ACC.bdp,0,wo.cost]])}},
  pack(no,by,date){const so=bySO(no),p=prod(so.p),a=avail(so.p);
    if(a<so.qty)return `Stok bebas ${p.name} kurang: perlu ${num(so.qty)}, tersedia ${num(a)} lbr.`;
    so.packed={date,by,pallets:Math.ceil(so.qty/p.perPallet)}},
  createSJ(o,by){const so=bySO(o.so);const sj={no:nextNo('SJ',o.date),date:o.date,so:so.no,cust:so.cust,p:so.p,qty:so.qty,truck:o.truck,driver:o.driver,status:'Proses muat',by};S.sj.push(sj);so.sj=sj.no;return sj},
  load(no,qty,by,date){const sj=byNo('sj',no),so=bySO(sj.so),f=S.fg[sj.p];qty=+qty;
    if(!(qty>0)||qty>so.qty)return `Lembar dimuat harus 1 s.d. ${num(so.qty)}.`;
    const cost=qty*f.cost;f.qty-=qty;sj.qty=qty;sj.status='Dikirim';sj.tally=by;sj.loadDate=date;so.status='Dikirim';so.shipped=qty;
    jr(date,`HPP kirim ${sj.no} – ${so.cust}`,sj.no,[[ACC.hpp,cost,0],[ACC.pbj,0,cost]])},
  invoice(no,by,date){const sj=byNo('sj',no),so=bySO(sj.so),amt=sj.qty*so.price;
    const inv={no:nextNo('INV',date),date,sj:sj.no,so:so.no,cust:so.cust,amt,paid:0,due:addDays(date,30),by};S.inv.push(inv);sj.inv=inv.no;
    jr(date,`Penjualan ${so.cust}`,inv.no,[[ACC.piut,amt,0],[ACC.jual,0,amt]]);return inv},
  payIn(no,amt,by,date){const inv=byNo('inv',no),rest=inv.amt-inv.paid;amt=+amt;
    if(!(amt>0)||amt>rest)return `Nominal harus 1 s.d. ${rp(rest)}.`;
    inv.paid+=amt;jr(date,`Terima bayar ${inv.cust}`,inv.no,[[ACC.kas,amt,0],[ACC.piut,0,amt]]);
    if(inv.paid>=inv.amt)bySO(inv.so).status='Selesai'},
  payOut(sup,amt,by,date){const rest=S.payables[sup]||0;amt=+amt;
    if(!(amt>0)||amt>rest)return `Nominal harus 1 s.d. ${rp(rest)}.`;
    S.payables[sup]-=amt;jr(date,`Bayar hutang ${sup}`,nextNo('BKK',date),[[ACC.hut,amt,0],[ACC.kas,0,amt]])},
  expense(desc,amt,by,date){amt=+amt;if(!(amt>0))return 'Nominal harus lebih dari 0.';if(!desc)return 'Isi keterangan biaya.';
    jr(date,desc,nextNo('BKK',date),[[ACC.beban,amt,0],[ACC.kas,0,amt]])}
};

/* ============ JARINGAN (simulasi offline) ============ */
const online=()=>navigator.onLine&&!simOffline;
function run(desc,fn){
  const res=fn();
  if(typeof res==='string')return res;
  if(!online())S.queue.push({t:new Date().toISOString(),desc,by:ME.u});
  save();closeModal();render();
  toast(online()?`${desc} · tersimpan`:`${desc} · disimpan di perangkat, menunggu sinkron`);
}
function sync(){if(!online()){toast('Masih offline. Data tetap aman di perangkat.');return}
  const n=S.queue.length;S.queue=[];save();render();toast(n?`${n} transaksi tersinkron ke server`:'Semua data sudah tersinkron')}

  add(can('stage'),S.wo.filter(w=>w.status==='Berjalan').length,'SPK berjalan, catat hasil tiap tahap','produksi');
  add(can('pack'),S.so.filter(s=>s.status==='Siap Kirim'&&!s.packed).length,'pesanan menunggu packing','gudang');
  add(can('createSJ'),S.so.filter(s=>s.packed&&!s.sj).length,'pesanan siap dibuatkan surat jalan','pengiriman');
  add(can('load'),S.sj.filter(s=>s.status==='Proses muat').length,'surat jalan menunggu tally muat','pengiriman');
  add(can('invoice'),S.sj.filter(s=>s.status==='Dikirim'&&!s.inv).length,'pengiriman belum ditagih','keuangan');
  add(can('payIn'),S.inv.filter(i=>i.paid<i.amt).length,'invoice belum lunas','keuangan');
  add(can('addRcv'),1,'Catat tally setiap truk OPC yang datang','penerimaan');
  add(r==='akuntansi',S.journal.length,'jurnal otomatis tercatat, periksa & tutup buku','akuntansi');
  return t.length?t.join(''):'<div class="empty">Tidak ada tugas tertunda.</div>'}

VIEWS.produksi=()=>{
  const ready=S.so.filter(s=>s.status==='Disetujui');
  const cards=[...S.wo].reverse().map(w=>{const p=prod(w.p),last=w.log.length?w.log[w.log.length-1].ok:w.qty,rej=sum(w.log,l=>l.rej),pct=Math.round(w.stage/STAGES.length*100);
    const st=STAGES.map((n,i)=>{const l=w.log[i];const c=i<w.stage?'done':(i===w.stage&&w.status==='Berjalan'?'cur':'');
      return `<div class="step ${c}" title="${STAGE_NOTE[i]}"><span class="nm">${n}</span><span class="mono">${l?`${num(l.ok)} ok${l.rej?` · ${l.rej} rj`:''}`:(c==='cur'?`${num(last)} masuk`:'–')}</span></div>`}).join('');
    const a=w.status==='Berjalan'&&can('stage')?btn('stage',w.no,`Catat hasil ${STAGES[w.stage]}`,true):'';
    return `<div class="wo"><div class="wo-h"><div><h3>${w.no} · ${p.name} ${p.grade}</h3><p class="small muted">${w.so} · ${esc(bySO(w.so).cust)} · target ${num(w.qty)} lbr · mulai ${fd(w.date)}</p></div>
      <div class="row">${w.status==='Selesai'?pill('Selesai '+fd(w.done),'ok'):pill('Berjalan','warn')}${a}</div></div>
      <div class="steps">${st}</div>
      <div class="row small"><div class="bar" style="flex:1;min-width:120px"><i style="width:${pct}%"></i></div><span class="mono">${pct}%</span>
      <span class="muted">Reject ${num(rej)} lbr (${num(rej/w.qty*100,1)}%) · Biaya bahan ${rp(w.cost)}</span></div></div>`}).join('');
  return `${ready.length&&can('createWO')?`<div class="card"><h2>Pesanan siap diproduksi</h2>${table(['No. PO','Pelanggan','Produk','#Qty','Tempo',''],ready.map(s=>`<tr><td class="mono">${s.no}</td><td>${esc(s.cust)}</td><td>${prod(s.p).name}</td><td class="n">${num(s.qty)}</td><td>${fd(s.due)}</td><td>${btn('createWO',s.no,'Buat SPK',true)}</td></tr>`))}</div>`:''}

/* ============ FORM AKSI ============ */
const FORMS={
  addSO(){openModal('Pesanan baru',`${fld('fCust','Pelanggan',sel('fCust',S.customers))}
    ${fld('fP','Produk',sel('fP',S.products.map(p=>[p.id,`${p.name} ${p.grade} ${p.glue}`])))}
    <div class="f2">${fld('fQty','Jumlah (lbr)',inp('fQty','number','','min="1" inputmode="numeric"'))}${fld('fPrice','Harga/lbr (Rp)',inp('fPrice','number',S.products[0].price,'min="1"'))}</div>
    <div class="f2">${fld('fDate','Tanggal PO',inp('fDate','date',TODAY))}${fld('fDue','Tempo kirim',inp('fDue','date',addDays(TODAY,14)))}</div>`,'Simpan pesanan',
    ()=>{const o={cust:V('fCust'),p:V('fP'),qty:+V('fQty'),price:+V('fPrice'),date:V('fDate'),due:V('fDue')};
      if(!(o.qty>0))return 'Isi jumlah lembar.';if(!(o.price>0))return 'Isi harga.';
      return run('Pesanan disimpan',()=>{A.addSO(o,ME.u)})});
    $('#fP').onchange=()=>{$('#fPrice').value=prod(V('fP')).price}},
  approveSO(no){const s=bySO(no),p=prod(s.p);openModal(`Setujui ${no}`,`<p>${esc(s.cust)} · ${p.name} ${p.grade} · <b class="mono">${num(s.qty)}</b> lbr × ${rp(s.price)} = <b>${rp(s.qty*s.price)}</b></p><p class="small muted">Tempo kirim ${fd(s.due)}. Setelah disetujui, PO masuk antrean produksi.</p>`,'Setujui',
    ()=>run(`${no} disetujui`,()=>A.approveSO(no,ME.u,TODAY)))},
  createWO(no){const s=bySO(no),need=A.need(s.p,s.qty);
    openModal(`SPK untuk ${no}`,`<p>${prod(s.p).name} · <b class="mono">${num(s.qty)}</b> lbr · ${esc(s.cust)}</p>
    ${table(['Bahan','#Kebutuhan','#Stok'],need.map(([id,q])=>{const m=mat(id);return `<tr><td>${m.name}</td><td class="n">${num(q,m.unit==='kg'?1:0)}</td><td class="n" style="color:var(--${m.stock<q?'bad':'ok'})">${num(m.stock,m.unit==='kg'?1:0)}</td></tr>`}))}
    <p class="small muted">Bahan langsung dipotong dari stok saat SPK terbit.</p>`,'Terbitkan SPK',()=>run('SPK diterbitkan',()=>A.createWO(no,ME.u,TODAY)))},
  stage(no){const w=byNo('wo',no),inn=A.stageIn(w),st=STAGES[w.stage];
    openModal(`${st} · ${no}`,`<p class="small muted">${STAGE_NOTE[w.stage]}</p>
    ${fld('fIn','Masuk tahap ini (lbr)',inp('fIn','number',inn,'disabled'))}
    ${fld('fOk','Hasil OK (lbr)',inp('fOk','number',inn,`min="0" max="${inn}" inputmode="numeric"`),'Selisih dicatat sebagai reject.')}
    ${w.stage===STAGES.length-1?'<p class="small">Tahap terakhir: hasil OK masuk stok barang jadi.</p>':''}`,'Simpan hasil',
    ()=>run(`Hasil ${st} tercatat`,()=>A.stage(no,V('fOk'),ME.u,TODAY)))},
  addRcv(){openModal('Tally penerimaan',`${fld('fSup','Supplier',sel('fSup',S.suppliers))}
    ${fld('fMat','Bahan',sel('fMat',S.materials.filter(m=>m.unit==='lbr').map(m=>[m.id,m.name])))}
    <div class="f2">${fld('fQty','Lembar datang',inp('fQty','number','','min="1" inputmode="numeric"'))}${fld('fRej','Reject (lbr)',inp('fRej','number',0,'min="0" inputmode="numeric"'))}</div>
    <div class="f2">${fld('fKa','Kadar air (%)',inp('fKa','number','','min="0" max="60" step="0.5"'))}${fld('fPr','Harga/lbr (Rp)',inp('fPr','number',mat('OPC-A').cost.toFixed(0),'min="1"'))}</div>
    ${fld('fDate','Tanggal',inp('fDate','date',TODAY))}`,'Simpan tally',
    ()=>{const o={supplier:V('fSup'),mat:V('fMat'),qty:+V('fQty'),reject:+V('fRej'),ka:V('fKa'),price:+V('fPr'),date:V('fDate')};
      if(!(o.qty>0))return 'Isi lembar datang.';if(o.reject<0||o.reject>o.qty)return 'Reject tidak boleh melebihi lembar datang.';if(!(o.price>0))return 'Isi harga.';
      return run('Tally disimpan',()=>{A.addRcv(o,ME.u)})});
    $('#fMat').onchange=()=>{$('#fPr').value=Math.round(mat(V('fMat')).cost)}},
  verifyRcv(no){const r=byNo('rcv',no),m=mat(r.mat),g=r.qty-r.reject;
    openModal(`Verifikasi ${no}`,`<p>${esc(r.supplier)} · ${m.name}</p><p>Diterima <b class="mono">${num(g)}</b> lbr (${num(m3(m,g),2)} m³) · nilai <b>${rp(g*r.price)}</b></p><p class="small muted">Tally oleh ${esc(uname(r.telly))}. Stok dan hutang supplier bertambah setelah verifikasi.</p>`,'Verifikasi',
    ()=>run(`${no} diverifikasi`,()=>A.verifyRcv(no,ME.u,TODAY)))},
  pack(no){const s=bySO(no),p=prod(s.p);openModal(`Packing ${no}`,`<p>${p.name} · <b class="mono">${num(s.qty)}</b> lbr = <b class="mono">${Math.ceil(s.qty/p.perPallet)}</b> pallet (isi ${p.perPallet} lbr/pallet)</p><p class="small muted">Stok bebas: ${num(avail(s.p))} lbr. Barang dikunci untuk PO ini.</p>`,'Kemas',
    ()=>run(`${no} dikemas`,()=>A.pack(no,ME.u,TODAY)))},
  createSJ(no){const s=bySO(no);openModal(`Surat jalan ${no}`,`<p>${esc(s.cust)} · ${prod(s.p).name} · ${num(s.qty)} lbr · ${s.packed.pallets} pallet</p>
    <div class="f2">${fld('fTr','No. polisi truk',inp('fTr','text','','placeholder="H 1234 AB"'))}${fld('fDr','Sopir',inp('fDr','text',''))}</div>${fld('fDate','Tanggal',inp('fDate','date',TODAY))}`,'Buat surat jalan',
    ()=>{if(!V('fTr')||!V('fDr'))return 'Isi no. polisi dan nama sopir.';return run('Surat jalan dibuat',()=>{A.createSJ({so:no,truck:V('fTr'),driver:V('fDr'),date:V('fDate')},ME.u)})})},
  load(no){const j=byNo('sj',no);openModal(`Tally muat ${no}`,`<p>${esc(j.cust)} · truk <span class="mono">${esc(j.truck)}</span></p>${fld('fQty','Lembar dimuat',inp('fQty','number',j.qty,`min="1" max="${j.qty}" inputmode="numeric"`),`Rencana ${num(j.qty)} lbr.`)}`,'Konfirmasi kirim',
    ()=>run(`${no} dikirim`,()=>A.load(no,V('fQty'),ME.u,TODAY)))},
  invoice(no){const j=byNo('sj',no),s=bySO(j.so);openModal(`Invoice untuk ${no}`,`<p>${esc(j.cust)} · ${num(j.qty)} lbr × ${rp(s.price)} = <b>${rp(j.qty*s.price)}</b></p><p class="small muted">Jatuh tempo 30 hari: ${fd(addDays(TODAY,30))}. PPN belum dihitung di prototipe.</p>`,'Terbitkan',
    ()=>run('Invoice terbit',()=>{A.invoice(no,ME.u,TODAY)}))},
  payIn(no){const i=byNo('inv',no),rest=i.amt-i.paid;openModal(`Pembayaran ${no}`,`<p>${esc(i.cust)} · sisa <b>${rp(rest)}</b></p>${fld('fAmt','Nominal diterima (Rp)',inp('fAmt','number',rest,`min="1" max="${rest}"`))}`,'Simpan',
    ()=>run('Pembayaran tercatat',()=>A.payIn(no,V('fAmt'),ME.u,TODAY)))},
  payOut(sup){const rest=S.payables[sup];openModal(`Bayar ${sup}`,`<p>Sisa hutang <b>${rp(rest)}</b></p>${fld('fAmt','Nominal dibayar (Rp)',inp('fAmt','number',rest,`min="1" max="${rest}"`))}`,'Bayar',
    ()=>run('Pembayaran supplier tercatat',()=>A.payOut(sup,V('fAmt'),ME.u,TODAY)))},
  expense(){openModal('Catat biaya',`${fld('fDesc','Keterangan',inp('fDesc','text','','placeholder="mis. Solar boiler"'))}${fld('fAmt','Nominal (Rp)',inp('fAmt','number','','min="1"'))}`,'Simpan',
    ()=>run('Biaya tercatat',()=>A.expense(V('fDesc'),V('fAmt'),ME.u,TODAY)))}
};

/* ============ EVENT ============ */
document.addEventListener('click',e=>{
  const c=e.target.closest('[data-user]');if(c){$('#lu').value=c.dataset.user;$('#lp').value='';$('#lp').focus();return}
  if(e.target.closest('[data-close]')||e.target.id==='modal'){closeModal();return}
  if(e.target.closest('#burger')){$('#side').classList.add('open');$('#scrim').classList.add('show');return}
  if(e.target.id==='scrim'||e.target.closest('.nav a')){const s=$('#side');if(s){s.classList.remove('open');$('#scrim').classList.remove('show')}}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,arg=b.dataset.arg;
  if(a==='logout'){ME=null;try{sessionStorage.removeItem(KEY+'-me')}catch(_){}location.hash='';render();return}
  if(a==='net'){if(!online()&&!simOffline){toast('Perangkat sedang offline.');return}
    if(simOffline){simOffline=false;render();sync()}else{simOffline=true;render();toast('Simulasi offline aktif. Transaksi tetap bisa dicatat.')}return}
  if(FORMS[a])FORMS[a](arg);
});
document.addEventListener('change',e=>{const s=e.target.closest('[data-role]');if(!s)return;const u=S.users.find(x=>x.u===s.dataset.role);u.role=s.value;save();toast(`Peran ${u.name} diubah ke ${ROLES[u.role]}`)});
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='loginForm'){const u=S.users.find(x=>x.u===V('lu').toLowerCase());
    if(!u||V('lp')!==PIN){$('#lErr').textContent='Nama pengguna atau PIN salah. Coba lagi.';return}
    ME=u;try{sessionStorage.setItem(KEY+'-me',u.u)}catch(_){}location.hash='dashboard';render();return}
  if(e.target.id==='mForm'&&mHandler){const r=mHandler();if(typeof r==='string')$('#mErr').textContent=r}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
window.addEventListener('hashchange',render);
window.addEventListener('online',()=>{render();sync()});
window.addEventListener('offline',()=>{render();toast('Koneksi terputus. Mode offline.')});

/* ============ MULAI ============ */
S=load();if(!S||S.v!==1){seed();save()}
try{const u=sessionStorage.getItem(KEY+'-me');if(u)ME=S.users.find(x=>x.u===u)||null}catch(_){}
render();
</script>
</body>
